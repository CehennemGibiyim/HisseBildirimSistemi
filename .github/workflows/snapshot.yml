name: Tarama anlık görüntüsü

on:
  schedule:
    # GitHub zamanlayıcısı en sık 5 dakikada bir tetikler; iş kendi içinde 2 dakikalık
    # turlarla döndüğü için gerçek tazeleme sıklığı 2 dakikadır.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Kaç tur çalışsın (her tur ~2 dk)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 170 tur x 2 dk ≈ 5 sa 40 dk; GitHub'ın 6 saatlik iş sınırının altında kalır.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Taramayı 2 dakikada bir yayınla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITERATIONS: ${{ github.event.inputs.iterations || '170' }}
        run: |
          set -uo pipefail
          DATA_DIR="$RUNNER_TEMP/data"
          mkdir -p "$DATA_DIR"
          git init -q "$DATA_DIR"
          cd "$DATA_DIR"
          git checkout -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ((i = 1; i <= ITERATIONS; i++)); do
            started=$(date +%s)
            echo "::group::Tur $i / $ITERATIONS"
            if (cd "$GITHUB_WORKSPACE" && node scripts/snapshot.mjs); then
              cp "$GITHUB_WORKSPACE/public/data/market.json" market.json
              git add market.json
              if git diff --cached --quiet; then
                echo "Tur $i: veri değişmedi, yayın atlandı"
              else
                git commit -q -m "Tarama anlık görüntüsü: $(date -u +%Y-%m-%dT%H:%MZ)"
                git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
                echo "Tur $i: anlık görüntü data dalına yazıldı"
              fi
            else
              echo "Tur $i: tarama başarısız, sonraki turda yeniden denenecek"
            fi
            echo "::endgroup::"

            if (( i < ITERATIONS )); then
              elapsed=$(( $(date +%s) - started ))
              if (( elapsed < 110 )); then
                sleep $(( 120 - elapsed ))
              else
                sleep 5
              fi
            fi
          done
