name: Tarama anlik goruntusu

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Nasdaq taramasini calistir
        run: node scripts/snapshot.mjs

      - name: Anlik goruntuyu data dalina yaz
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data"
          cp public/data/market.json "$RUNNER_TEMP/data/market.json"
          cd "$RUNNER_TEMP/data"
          git init -q
          git checkout -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          git commit -q -m "Tarama anlik goruntusu: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
