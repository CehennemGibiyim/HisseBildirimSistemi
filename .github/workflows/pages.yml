name: Web sürümünü yayınla

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Yedek anlık görüntüyü tazele
        continue-on-error: true
        run: npm run snapshot

      - name: Statik siteyi derle
        env:
          BASE_PATH: /HisseBildirimSistemi
          NEXT_PUBLIC_BASE_PATH: /HisseBildirimSistemi
        run: npm run build

      - name: .nojekyll ekle
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
